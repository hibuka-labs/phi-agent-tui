name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Code quality checks ──
  check:
    name: check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Build & test on every release platform ──
  # The OS matrix is the platform compile check that must pass BEFORE a
  # `cargo publish` — a platform-specific compile error that first surfaces
  # on crates.io has to be yanked (family incident: phimint 0.7.0, Windows).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # ── Docs ──
  doc:
    name: doc (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Doc (zero warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  # ── Coverage gate ──
  # Design §7.3 caliber: llvm-cov line coverage with the TTY glue excluded —
  # `run.rs` (event loop / terminal glue) is end-to-end covered by the PTY
  # smoke gate, not by unit tests. Measured 2026-11-02 at 89.53% lines on the
  # non-glue surface; threshold 80 (the design's "born at ≥80%").
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage gate
        run: cargo llvm-cov --lib --ignore-filename-regex '(^|/)run\.rs$' --fail-under-lines 80 --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        # Best-effort: a repo without a CODECOV_TOKEN secret must not fail the
        # build on the upload alone. The coverage *gate* above still fails it.
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
