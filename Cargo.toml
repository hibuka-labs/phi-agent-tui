[package]
name = "phi-agent-tui"
version = "0.4.0"
edition = "2024"
description = "Reusable terminal-app shell for LLM agent products: event loop, transcript translation, theme, approval/ask interaction machinery, and the ShellSpec/ShellHandles wire-up. No product strategy lives here."
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-agent-tui"
keywords = ["tui", "llm", "agent", "terminal", "chat"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
# The agent runtime: turns, sessions, events, the tool registry, and the
# interaction vocabulary (ApprovalItem / AskAnswer / AskOption / ApprovalHandler).
# The shell consumes it; it never builds an agent (design notes §5: the product
# assembles its own agent and hands it in).
phi-agent = { version = "0.23.0", features = ["skill", "multi-agent"] }
# Chat-TUI component layer (lines / transcript / stream / wrap / viewport /
# selection / picker / completer / markdown / diff) — pure widgets, no agent
# semantics (phi-tui's own charter).
phi-tui = { version = "0.5.0" }
# Background shell task registry (the quit path shuts it down) + tail reader.
phi-kernel-tools = { version = "0.15.0", features = ["shell"] }
# Per-turn token usage telemetry + session metrics (observability = mechanism).
phi-telemetry = { version = "0.9.0" }
# Log sinks; the shell re-points them at the resumed session's log file.
log-core = "0.1.5"

tokio = { version = "1", features = ["full"] }
# CancellationToken for the interaction slot's consent release.
tokio-util = "0.7"
anyhow = "1"
async-trait = "0.1"
# The exit-dump mode is a config-schema enum on the product side too.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# UI: ratatui for the TUI, crossterm as its backend + raw-mode key/paste input.
ratatui = "0.30"
crossterm = "0.28"
# Display width for wide CJK glyphs (TUI wrap).
unicode-width = "0.1"
# Clock display in the task panel (finished-at) and picker rows (when).
chrono = "0.4"
# Clipboard for Ctrl+Y "copy last reply" (arboard is cross-platform).
arboard = "3"

# term_guard: tcgetattr to spot an external termios clobber (MCP children can
# flip the tty back to cooked). Unix-only probe; Windows console is untouched.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Test fixtures for the paste pipeline (hand-rolled PNG bytes would only pin
# our own byte twiddling, not the reader).
image = { version = "0.25", default-features = false, features = ["png"] }
